[project]
name = "money-bin-receipt-ingest"
version = "0.1.0"
description = "Turns phone photos of paper receipts into a clean, numbered receipt set for OCR evaluation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5.5",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "pyyaml>=6.0.3",
    "zxing-cpp>=3.1.1",
]

[project.scripts]
receipt-ingest = "receipt_ingest.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/receipt_ingest"]

[tool.uv]
# opencv-python-headless 5.1.0.95 ships Windows wheels only. Limiting the lock to the two platforms the
# tool runs on (the owner's Mac and the Linux CI runner) and requiring wheels for both makes uv pick a
# release that installs on each of them.
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=receipt_ingest --cov-report=term-missing --cov-fail-under=80"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "N",   # pep8 naming
    "RUF", # ruff-specific rules
]
