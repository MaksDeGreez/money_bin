# PostgreSQL, reached over the local socket as the current OS user (no username or password).
#
# Development and production use separate databases.
#
# The test database is per git worktree: money_bin_v2_test in the main checkout and
# money_bin_v2_test_<name> in a linked worktree (config/worktree_isolation.rb), so test runs in two
# worktrees never wipe each other's data. Parallel test workers add "_0", "_1", ... to the name.
#
# DATABASE_URL, when set, is merged on top of these values by Rails (CI uses it).
default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: money_bin_v2_development

test:
  <<: *default
  database: <%= MoneyBin::WorktreeIsolation.test_database %>

production:
  <<: *default
  database: money_bin_v2_production
