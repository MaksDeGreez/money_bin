# Action Cable uses Redis everywhere except tests, so broadcasts sent from
# Sidekiq jobs reach the Puma process.
development:
  adapter: redis
  url: <%= MoneyBin::RedisUrl.for("development") %>
  channel_prefix: money_bin_v2_development

test:
  adapter: test

production:
  adapter: redis
  url: <%= MoneyBin::RedisUrl.for("production") %>
  channel_prefix: money_bin_v2_production
