# Sidekiq process configuration. Started by bin/dev (Procfile.dev) with
# `bundle exec sidekiq -C config/sidekiq.yml`.
#
# Two capsules (thread pools inside the one process, each working its own queues):
# - the default one, 4 threads, for everything else;
# - `ocr`, 1 thread, for ReceiptOcrJob's queue and ReceiptCategoriseJob's: the local model reads one receipt
#   (or categorises one receipt's items) at a time, so parallel jobs would only queue up inside the ML service
#   and run into the client's timeout. The queues are listed without weights, so they are strictly ordered:
#   "Suggest categories again" (seconds) runs before the next of possibly hundreds of queued reads.
# Every thread may hold a database connection, so the threads of all capsules together (5) must not exceed
# the Active Record pool (`max_connections` in config/database.yml, 5 unless RAILS_MAX_THREADS says
# otherwise). test/config/sidekiq_config_test.rb checks both.
:concurrency: 4
:queues:
  - default
  - mailers
:timeout: 25
:capsules:
  :ocr:
    :queues:
      - receipt_categorise
      - receipt_ocr
    :concurrency: 1
