# A slice of the taxonomy in db/seeds/taxonomy.yml. Names, slugs and positions match the seed exactly, so
# running the seed in a test updates these rows instead of adding new ones.
groceries_group:
  name: Groceries
  slug: groceries
  position: 1

groceries:
  parent: groceries_group
  name: Groceries
  slug: groceries/groceries
  position: 1
  description: Food and everyday groceries, including drinking-water delivery.

