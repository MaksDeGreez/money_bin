# The record of how a fixture receipt was booked (ReceiptBooking). The market receipt created its transaction
# (market_split), so there is no earlier state; the digest is that of market_split's two lines.
market_booking:
  receipt: market_receipt
  ledger_transaction: market_split
  mode: created
  lines_digest: <%= ReceiptBooking.digest_lines([ [ ActiveRecord::FixtureSet.identify(:groceries), BigDecimal("-1000.40") ],
                                                  [ ActiveRecord::FixtureSet.identify(:household_supplies), BigDecimal("-250.00") ] ]) %>
  assigned_payee: example_market
